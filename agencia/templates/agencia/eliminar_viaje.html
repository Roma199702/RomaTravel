{% extends 'agencia/base.html' %}

{% block title %}
Eliminar viaje | Roma Travel
{% endblock %}

{% block contenido %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-body text-center p-5">

                    <div
                        class="display-4 text-danger mb-3"
                    >
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>

                    <h2 class="fw-bold">
                        Eliminar viaje
                    </h2>

                    <p class="text-muted mt-3">
                        ¿Estás segura de que deseas eliminar
                        este viaje?
                    </p>

                    <div class="alert alert-light">

                        <strong>
                            {{ viaje.destino }}
                        </strong>

                        <br>

                        {{ viaje.pais }}

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            <i class="bi bi-trash me-1"></i>
                            Sí, eliminar
                        </button>

                        <a
                            href="{% url 'administrar_viajes' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
