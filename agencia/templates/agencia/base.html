{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Roma Travel
        {% endblock %}
    </title>


    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ICONOS BOOTSTRAP -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        /* =========================
           COLORES PRINCIPALES
        ========================= */

        :root {
            --azul-oscuro: #073763;
            --azul: #0d6efd;
            --azul-claro: #eaf3ff;
            --amarillo: #ffc107;
            --fondo: #f5f7fb;
            --texto: #263238;
        }


        /* =========================
           GENERAL
        ========================= */

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background-color: var(--fondo);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           BARRA DE NAVEGACIÓN
        ========================= */

        .navbar-roma {

            min-height: 82px;

            background: linear-gradient(
                135deg,
                #052d55,
                #0d6efd
            );

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.16);
        }


        .navbar-brand {

            font-size: 27px;

            font-weight: 700;

            letter-spacing: 0.4px;
        }


        .navbar-brand i {

            color: var(--amarillo);

            margin-right: 7px;
        }


        .navbar-nav {

            gap: 5px;
        }


        .navbar-nav .nav-link {

            color: rgba(
                255,
                255,
                255,
                0.92
            );

            padding: 10px 13px !important;

            border-radius: 8px;

            font-size: 16px;

            font-weight: 500;

            transition: 0.2s;
        }


        .navbar-nav .nav-link:hover {

            color: white;

            background-color: rgba(
                255,
                255,
                255,
                0.15
            );
        }


        /* =========================
           PORTADA / HERO
        ========================= */

        .hero {

            min-height: calc(100vh - 82px);

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            text-align: center;

            color: white;


            /*
                AQUÍ SE CARGA
                portada-viajes.png
            */

            background:

                linear-gradient(
                    rgba(4, 25, 48, 0.45),
                    rgba(4, 37, 70, 0.70)
                ),

                url(
                    "{% static 'agencia/img/portada-viajes.png' %}"
                );


            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;
        }


        .hero-content {

            max-width: 850px;

            padding: 60px 25px;
        }


        .hero-badge {

            display: inline-block;

            padding: 9px 18px;

            margin-bottom: 22px;

            border: 1px solid
                rgba(255, 255, 255, 0.5);

            border-radius: 50px;

            background-color:
                rgba(255, 255, 255, 0.13);

            backdrop-filter: blur(4px);
        }


        .hero h1 {

            font-size: 68px;

            font-weight: 800;

            text-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.30);
        }


        .hero-subtitle {

            margin-top: 15px;

            font-size: 27px;

            font-weight: 600;
        }


        .hero-description {

            max-width: 650px;

            margin: 20px auto;

            font-size: 18px;

            color:
                rgba(255, 255, 255, 0.92);
        }


        /* =========================
           BOTONES
        ========================= */

        .btn {

            border-radius: 9px;

            font-weight: 600;

            padding: 10px 18px;
        }


        .btn-reservar {

            padding: 15px 35px;

            border: none;

            border-radius: 10px;

            background-color:
                var(--amarillo);

            color: #17202a;

            font-size: 18px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }


        .btn-reservar:hover {

            background-color: #ffd044;

            color: #17202a;

            transform:
                translateY(-2px);
        }


        /* =========================
           ENCABEZADOS
        ========================= */

        .page-header {

            margin-bottom: 35px;
        }


        .page-header h1,
        .page-header h2 {

            color:
                var(--azul-oscuro);

            font-weight: 700;
        }


        .page-header p {

            color: #6c757d;

            font-size: 17px;
        }


        /* =========================
           TARJETAS
        ========================= */

        .card {

            border: none;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 20px
                rgba(33, 37, 41, 0.09);
        }


        .destination-card {

            transition: 0.25s;
        }


        .destination-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 12px 30px
                rgba(33, 37, 41, 0.15);
        }


        .trip-icon {

            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background-color:
                var(--azul-claro);

            color:
                var(--azul);

            font-size: 25px;
        }


        .precio {

            color:
                var(--azul);

            font-size: 30px;

            font-weight: 700;
        }


        /* =========================
           FORMULARIOS
        ========================= */

        .form-card {

            border-radius: 18px;

            overflow: hidden;
        }


        .form-header {

            padding: 28px;

            background:
                linear-gradient(
                    135deg,
                    #073763,
                    #0d6efd
                );

            color: white;
        }


        .form-label {

            margin-bottom: 7px;

            color: #34495e;

            font-weight: 600;
        }


        .form-control,
        .form-select {

            min-height: 47px;

            padding: 10px 13px;

            border:
                1px solid
                #d9e1e8;

            border-radius: 9px;
        }


        textarea.form-control {

            min-height: 100px;
        }


        .form-control:focus,
        .form-select:focus {

            border-color:
                var(--azul);

            box-shadow:
                0 0 0 3px
                rgba(13, 110, 253, 0.12);
        }


        /* =========================
           TABLAS
        ========================= */

        .table-container {

            overflow: hidden;

            background-color: white;

            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(33, 37, 41, 0.09);
        }


        .table {

            margin-bottom: 0;
        }


        .table thead th {

            padding: 16px 12px;

            border: none;

            background-color:
                var(--azul-oscuro);

            color: white;

            white-space: nowrap;
        }


        .table tbody td {

            padding: 15px 12px;

            vertical-align: middle;
        }


        .table tbody tr:hover {

            background-color:
                #f4f8ff;
        }


        /* =========================
           ALERTAS
        ========================= */

        .alert {

            border: none;

            border-radius: 12px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer-roma {

            margin-top: 70px;

            padding: 45px 0 25px;

            background-color:
                #052b52;

            color: white;
        }


        .footer-brand {

            font-size: 24px;

            font-weight: 700;
        }


        .footer-brand i {

            color:
                var(--amarillo);
        }


        .footer-text {

            color:
                rgba(255, 255, 255, 0.72);
        }


        .footer-line {

            border-color:
                rgba(255, 255, 255, 0.15);
        }


        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 768px) {

            .hero {

                min-height: 78vh;
            }


            .hero h1 {

                font-size: 44px;
            }


            .hero-subtitle {

                font-size: 21px;
            }


            .hero-description {

                font-size: 16px;
            }


            .navbar-nav {

                margin-top: 15px;

                padding-bottom: 10px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav
    class="navbar navbar-expand-lg navbar-dark navbar-roma"
>

    <div class="container">


        <a
            class="navbar-brand"
            href="{% url 'inicio' %}"
        >

            <i class="bi bi-airplane-fill"></i>

            Roma Travel

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
        >

            <span
                class="navbar-toggler-icon"
            ></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menuPrincipal"
        >


            <div
                class="navbar-nav ms-auto"
            >


                <a
                    class="nav-link"
                    href="{% url 'inicio' %}"
                >

                    <i class="bi bi-house-door"></i>

                    Inicio

                </a>


                <a
                    class="nav-link"
                    href="{% url 'viajes_disponibles' %}"
                >

                    <i class="bi bi-suitcase-lg"></i>

                    Viajes

                </a>


                <a
                    class="nav-link"
                    href="{% url 'lista_reservas' %}"
                >

                    <i class="bi bi-calendar-check"></i>

                    Reservas

                </a>


                <a
                    class="nav-link"
                    href="{% url 'sobre_nosotros' %}"
                >

                    <i class="bi bi-info-circle"></i>

                    Sobre nosotros

                </a>


                <a
                    class="nav-link"
                    href="{% url 'administrar_viajes' %}"
                >

                    <i class="bi bi-gear"></i>

                    Administrar

                </a>


            </div>


        </div>


    </div>

</nav>


<!-- =========================
     CONTENIDO
========================= -->

<main>

    {% block contenido %}

    {% endblock %}

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer-roma">


    <div class="container">


        <div class="row align-items-center">


            <div class="col-md-6">


                <div class="footer-brand">

                    <i class="bi bi-airplane-fill"></i>

                    Roma Travel

                </div>


                <p class="footer-text mt-2">

                    Tu próximo destino comienza aquí.

                </p>


            </div>


            <div
                class="col-md-6 text-md-end"
            >


                <p class="footer-text mb-1">

                    <i class="bi bi-globe-americas"></i>

                    Agencia de viajes

                </p>


                <p class="footer-text mb-0">

                    Viaja, descubre y disfruta.

                </p>


            </div>


        </div>


        <hr class="footer-line">


        <div class="text-center">


            <small class="footer-text">

                © 2026 Roma Travel

            </small>


        </div>


    </div>


</footer>


<!-- JAVASCRIPT BOOTSTRAP -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
