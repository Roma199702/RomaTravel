<!DOCTYPE html>

<html lang="es">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {% block title %}

        Roma Travel

        {% endblock %}

    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {

            background-color: #f5f7fa;

        }


        .navbar {

            min-height: 85px;

        }


        .navbar-brand {

            font-size: 28px;

            font-weight: bold;

        }


        .navbar-nav .nav-link {

            font-size: 17px;

            margin-left: 10px;

        }


        .hero {

            min-height: calc(100vh - 85px);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: white;

            background:

                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),

                url(
                    "https://images.unsplash.com/photo-1488646953014-85cb44e25828"
                );

            background-size: cover;

            background-position: center;

        }


        .hero h1 {

            font-size: 70px;

            font-weight: bold;

        }


        .card {

            border: none;

            border-radius: 18px;

            overflow: hidden;

        }


        .destination-image {

            width: 100%;

            height: 230px;

            object-fit: cover;

        }


        .precio {

            color: #0d6efd;

            font-size: 30px;

            font-weight: bold;

        }


        footer {

            margin-top: 60px;

        }


        @media (max-width: 768px) {

            .hero h1 {

                font-size: 45px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     MENÚ PRINCIPAL
     ========================= -->

<nav
    class="navbar navbar-expand-lg navbar-dark bg-primary"
>

    <div class="container">


        <a
            class="navbar-brand"
            href="{% url 'inicio' %}"
        >

            ✈️ Roma Travel

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
        >

            <span
                class="navbar-toggler-icon"
            ></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu"
        >


            <div class="navbar-nav ms-auto">


                <a
                    class="nav-link"
                    href="{% url 'inicio' %}"
                >

                    Inicio

                </a>


                <a
                    class="nav-link"
                    href="{% url 'lista_reservas' %}"
                >

                    📋 Ver reservas

                </a>


                <a
                    class="nav-link"
                    href="{% url 'sobre_nosotros' %}"
                >

                    ℹ️ Sobre nosotros

                </a>


                <a
                    class="nav-link"
                    href="{% url 'administrar_viajes' %}"
                >

                    ⚙️ Administrar viajes

                </a>


            </div>


        </div>


    </div>

</nav>


<!-- =========================
     CONTENIDO
     ========================= -->

{% block contenido %}

{% endblock %}


<!-- =========================
     FOOTER
     ========================= -->

<footer
    class="bg-dark text-white text-center py-4"
>

    <h5>

        ✈️ Roma Travel

    </h5>


    <p class="mb-0">

        Tu próximo destino comienza aquí

    </p>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
