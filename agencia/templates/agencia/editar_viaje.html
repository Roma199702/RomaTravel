{% extends 'agencia/base.html' %}


{% block title %}
Editar viaje | Roma Travel
{% endblock %}


{% block contenido %}


<div class="container my-5">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card shadow">


                <div class="card-body p-5">


                    <h1 class="fw-bold">
                        ✏️ Editar viaje
                    </h1>


                    <p class="text-muted">

                        Modifica la información de
                        {{ viaje.destino }}.

                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        {{ formulario.as_p }}


                        <button
                            type="submit"
                            class="btn btn-warning btn-lg"
                        >
                            Guardar cambios
                        </button>


                        <a
                            href="{% url 'administrar_viajes' %}"
                            class="btn btn-outline-secondary btn-lg"
                        >
                            Cancelar
                        </a>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
